<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampire Power Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>🔌 Vampire Power Calculator</h1>
        <p class="subtitle">See how much money your turned-off appliances are wasting annually.</p>

        <!-- Step 1: Input Electricity Cost -->
        <div class="input-group">
            <label for="rate">Your Local Electricity Rate (¢ per kWh):</label>
            <input type="number" id="rate" value="16.5" step="0.1">
            <small>Average US rate is ~16.5¢</small>
        </div>

        <h3>Select the idle appliances in your home:</h3>
        
        <!-- Step 2: Appliance Grid -->
        <div class="appliance-grid">
            <button class="appliance-btn" data-watts="15" onclick="toggleAppliance(this)">
                🎮 Gaming Console (Rest Mode) <span class="watts">~15W</span>
            </button>
            <button class="appliance-btn" data-watts="3" onclick="toggleAppliance(this)">
                📺 Smart TV (Standby) <span class="watts">~3W</span>
            </button>
            <button class="appliance-btn" data-watts="4" onclick="toggleAppliance(this)">
                🔊 Smart Speaker / Voice Assistant <span class="watts">~4W</span>
            </button>
            <button class="appliance-btn" data-watts="7" onclick="toggleAppliance(this)">
                💻 Desktop PC (Sleep Mode) <span class="watts">~7W</span>
            </button>
            <button class="appliance-btn" data-watts="2" onclick="toggleAppliance(this)">
                ☕ Microwave / Coffee Maker Clock <span class="watts">~2W</span>
            </button>
            <button class="appliance-btn" data-watts="10" onclick="toggleAppliance(this)">
                📡 Wi-Fi Router / Cable Box <span class="watts">~10W</span>
            </button>
        </div>
        <!-- Custom Appliance Form -->
        <div class="custom-appliance">
            <h3>Add a Custom Appliance:</h3>
            <div class="custom-inputs">
                <input type="text" id="custom-name" placeholder="Device name (e.g., Air Fryer)">
                <input type="number" id="custom-watts" placeholder="Watts" min="1">
                <button type="button" id="add-btn" onclick="addCustomAppliance()">+ Add</button>
            </div>
        </div>

        <!-- Step 3: Results Display -->
        <div class="results-box">
            <h2>Your Annual Waste:</h2>
            <div class="total-cost" id="total-display">$0.00</div>
            <p id="details-display">Select an appliance above to start calculating.</p>
        </div>
    </div>

    <script src="app.js"></script>
